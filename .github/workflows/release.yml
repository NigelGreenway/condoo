# Builds the condoo binaries and attaches them to a GitHub release.
#
# Three ways to run it; each ends with the same files on the release, so running twice is safe:
#   - push a tag:  git tag v1.0.0 && git push origin v1.0.0       (creates the release)
#   - publish a release in GitHub's web page                      (adds the files to it)
#   - Actions > Release > Run workflow, with an existing tag      (rebuilds, replaces the files)
name: Release
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

# One run per tag at a time, so a tag push and a release made in the web page don't race.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: node --test test/*.test.mjs
      - name: Build every platform
        run: |
          set -eu
          mkdir dist
          # Pure Go (no cgo), so one runner cross-compiles them all.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/condoo-$os-$arch$ext" ./cmd/condoo
          done
          tar -czf dist/condoo-mod.tar.gz mods/condoo/*.js mods/condoo/mod.json
          cp install.sh install.ps1 AGENTS-snippet.md dist/
          (cd dist && sha256sum * > checksums.txt)
          cat dist/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Run every binary on its own OS and CPU before anything is published.
  verify:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, bin: condoo-linux-amd64 }
          - { os: ubuntu-24.04-arm, bin: condoo-linux-arm64 }
          - { os: macos-latest, bin: condoo-darwin-arm64 }
          - { os: macos-15-intel, bin: condoo-darwin-amd64 }
          - { os: windows-latest, bin: condoo-windows-amd64.exe }
          - { os: windows-11-arm, bin: condoo-windows-arm64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Checksum, version, and a round trip through a scratch database
        shell: bash
        env:
          BIN: ${{ matrix.bin }}
        run: |
          set -euxo pipefail
          cd dist
          line=$(grep " $BIN\$" checksums.txt)
          if command -v sha256sum >/dev/null; then echo "$line" | sha256sum -c -
          else echo "$line" | shasum -a 256 -c -; fi
          chmod +x "$BIN"
          export CONDOO_DB="$RUNNER_TEMP/verify.sqlite" CONDOO_CONFIG="$RUNNER_TEMP/verify.json" CONDOO_NAME=CI
          "./$BIN" version | grep -F "\"$TAG\""
          "./$BIN" ask "Release check?" -s smoke --agent CI | grep -F '"waiting_on":"CI"'
          "./$BIN" list | grep -F 'Release check?'

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release if needed, then attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].name)'
